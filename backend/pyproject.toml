[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "socforge-backend"
version = "0.1.0"
description = "Educational SOC analyst training platform API"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2",
    "email-validator>=2.1,<3",
    "fastapi>=0.110,<1",
    "PyJWT>=2.8,<3",
    "pwdlib[argon2]>=0.2,<1",
    "psycopg[binary]>=3.1,<4",
    "pydantic-settings>=2.2,<3",
    "PyYAML>=6,<7",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "mypy>=1.9,<2",
    "pytest>=8,<9",
    "ruff>=0.3,<1",
    "types-PyYAML>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
